    function generateAppIconDataUrl(size = 192) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0f766e';
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(0, 0, size, size, size * 0.24);
      } else {
        ctx.rect(0, 0, size, size);
      }
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = `900 ${Math.floor(size * 0.44)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('DP', size / 2, size / 2 + size * 0.03);
      return canvas.toDataURL('image/png');
    }

    function rebuildDynamicOrderedClasses() {
      const set = new Set(BASE_CLASSES);
      Object.values(cachedStudents).forEach(s => { if (s && s.class) set.add(s.class); });
      Object.values(cachedTeachers).forEach(t => { if (t && t.class) set.add(t.class); });
      ORDERED_CLASSES = Array.from(set).sort((a, b) => {
        const na = parseInt(a, 10) || 99;
        const nb = parseInt(b, 10) || 99;
        if (na !== nb) return na - nb;
        return a.localeCompare(b);
      });
    }

    function initDatabaseDefaults() {

      db.ref('teachers').once('value', snap => {
        const rawTeachers = snap.val() || {};
        const cleanTeachersMap = {};
        const migratedWorkersMap = {};

        Object.keys(rawTeachers).forEach(k => {
          const item = rawTeachers[k];
          if (!item || !item.login) return;
          if (item.role === 'worker' || item.role === 'admin' || item.jobTitle) {
            migratedWorkersMap[k] = {
              id: k,
              name: item.name,
              role: item.role === 'admin' ? 'admin' : 'worker',
              jobTitle: item.jobTitle || (item.role === 'admin' ? 'Administrator xodim' : 'Maktab xodimi'),
              workStart: item.workStart || (item.jobTitle === 'Kutubxonachi' ? '08:30' : '08:00'),
              workEnd: item.workEnd || '17:00',
              login: item.login,
              pass: item.pass || '123456'
            };
          } else {
            cleanTeachersMap[k] = item;
          }
        });

        INITIAL_TEACHERS.forEach(t => {
          const existingKey = Object.keys(cleanTeachersMap).find(k => (cleanTeachersMap[k].login || '').toLowerCase() === t.login.toLowerCase());
          const targetId = existingKey || t.id;
          cleanTeachersMap[targetId] = {
            ...t,
            ...(cleanTeachersMap[targetId] || {}),
            id: targetId,
            role: t.role,
            class: t.class
          };
        });

        db.ref('teachers').set(cleanTeachersMap);

        db.ref('workers').once('value', wSnap => {
          const existingWorkers = { ...migratedWorkersMap, ...(wSnap.val() || {}) };
          INITIAL_WORKERS.forEach(w => {
            const matchKey = Object.keys(existingWorkers).find(k => (existingWorkers[k].login || '').toLowerCase() === w.login.toLowerCase());

            existingWorkers[targetId] = {
              ...w,
              ...(existingWorkers[targetId] || {}),
              id: targetId,
              role: w.role,
              jobTitle: (existingWorkers[targetId] && existingWorkers[targetId].jobTitle) ? existingWorkers[targetId].jobTitle : w.jobTitle,

          db.ref('workers').set(existingWorkers);

    function handleLogin() {
      const u = (document.getElementById('loginUsername').value || '').trim().toLowerCase();
      const p = (document.getElementById('loginPassword').value || '').trim();
      const errEl = document.getElementById('loginErrorMsg');

      if (!u || !p) {
        errEl.innerText = "Login va parolni kiriting!";
        errEl.classList.remove('hidden');
        return;
      }

      const allTeachers = [...Object.values(cachedTeachers), ...INITIAL_TEACHERS];
      const allWorkers = [...Object.values(cachedWorkers), ...INITIAL_WORKERS];

      const foundTeacher = allTeachers.find(
        t => t && (t.login || '').trim().toLowerCase() === u && String(t.pass).trim() === p
      );

      const foundWorker = allWorkers.find(
        w => w && (w.login || '').trim().toLowerCase() === u && String(w.pass).trim() === p
      );

      const userObj = foundTeacher || foundWorker;

      if (!userObj) {
        errEl.innerText = "Login yoki parol noto'g'ri!";
        errEl.classList.remove('hidden');
        return;
      }

      errEl.classList.add('hidden');

      showApp();

    // ==================== 8. O'QUVCHILAR DAVOMATI FORMULASI VA TEZKOR JADVALLARI ====================
    function getEffectiveStatus(attRecord, key) {
      if (!attRecord) return 'present';
      if (key === 'ERT') return attRecord['ERT'] || 'present';
      if (attRecord[key]) return attRecord[key];
      if (attRecord['ERT'] === 'absent' || attRecord['ERT'] === 'excused') return attRecord['ERT'];
      return 'present';
    }

    function getStudentDailyRatio(attRecord) {
      if (!attRecord) return 1;
      if (attRecord['ERT'] === 'excused') return 1;
      let presentUnits = 0;
      for (let h = 1; h <= 8; h++) {
        const st = getEffectiveStatus(attRecord, String(h));
        if (st === 'present' || st === 'excused') presentUnits += 1;
        else if (st === 'late') presentUnits += 0.5;
      }
      return presentUnits / 8;
    }

    function sortStudentsCanonical(list) {
      const classRank = {};
      ORDERED_CLASSES.forEach((c, i) => { classRank[c] = i; });
      return [...list].sort((a, b) => {
        const ra = classRank[a.class] ?? 999;
        const rb = classRank[b.class] ?? 999;
        if (ra !== rb) return ra - rb;
        return (a.name || '').localeCompare(b.name || '');
      });
    }

    // 1.1 Umumiy Tahlil va Chart.js Grafiklari (Animatsiyasiz tezkor yangilanish)
    function renderAnalyticsSection() {
      const allStudents = Object.values(cachedStudents);
      const total = allStudents.length;

      let ertAbsent = 0;
      let ertExcused = 0;
      let ertLate = 0;
      let sumDailyRatio = 0;

      allStudents.forEach(st => {
        const rec = cachedAttendance[st.id] || {};
        const ert = getEffectiveStatus(rec, 'ERT');
        if (ert === 'absent') ertAbsent++;
        else if (ert === 'excused') ertExcused++;
        else if (ert === 'late') ertLate++;
        sumDailyRatio += getStudentDailyRatio(rec);
      });

      const ertPresent = Math.max(0, total - ertAbsent - ertExcused);
      const ertPct = total > 0 ? (((total - ertAbsent) / total) * 100).toFixed(1) : "100.0";
      const dailyPct = total > 0 ? ((sumDailyRatio / total) * 100).toFixed(1) : "100.0";

      document.getElementById('statTotalStudents').innerText = `${total} nafar`;
      document.getElementById('statPresentToday').innerText = `${ertPresent} (${ertPct}%)`;
      document.getElementById('statAbsentToday').innerText = `${ertAbsent} nafar`;
      document.getElementById('statExcusedSub').innerText = `Sababli: ${ertExcused} | Kechikkan: ${ertLate}`;
      document.getElementById('statDailyOverallPct').innerText = `${dailyPct}%`;

      // Sinflar reytingi ma'lumoti
      const clsLabels = [];
      const clsPcts = [];
      ORDERED_CLASSES.forEach(cName => {
        const cSt = allStudents.filter(s => s.class === cName);
        if (cSt.length === 0) return;
        let rSum = 0;
        cSt.forEach(s => { rSum += getStudentDailyRatio(cachedAttendance[s.id]); });
        clsLabels.push(cName);
        clsPcts.push(Number(((rSum / cSt.length) * 100).toFixed(1)));
      });

      // Dars soatlari (1-8) kesimida qatnashish
      const hourLabels = ['Ertalab', '1-s', '2-s', '3-s', '4-s', '5-s', '6-s', '7-s', '8-s'];
      const hourCounts = ALL_ATT_KEYS.map(k => {
        let p = 0;
        allStudents.forEach(s => {
          if (getEffectiveStatus(cachedAttendance[s.id], k) !== 'absent') p++;
        });
        return p;
      });

      const isDark = document.body.classList.contains('dark-eye-mode');
      const textColor = isDark ? '#94a3b8' : '#64748b';
      const gridColor = isDark ? 'rgba(148,163,184,0.1)' : 'rgba(148,163,184,0.2)';

      const ctx1 = document.getElementById('classRatingChart')?.getContext('2d');
      if (ctx1) {
        if (ratingChartInstance) ratingChartInstance.destroy();
        ratingChartInstance = new Chart(ctx1, {
          type: 'bar',
          data: {
            labels: clsLabels,
            datasets: [{ label: 'Davomat %', data: clsPcts, backgroundColor: '#0f766e', borderRadius: 6 }]
          },
          options: {
            animation: false,
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: textColor }, grid: { display: false } },
              y: { min: 0, max: 100, ticks: { color: textColor }, grid: { color: gridColor } }
            }
          }
        });
      }

      const ctx2 = document.getElementById('hourlyDynamicChart')?.getContext('2d');
      if (ctx2) {
        if (dynamicChartInstance) dynamicChartInstance.destroy();
        dynamicChartInstance = new Chart(ctx2, {
          type: 'line',
          data: {
            labels: hourLabels,
            datasets: [{
              label: 'Darsda bor o\'quvchilar',
              data: hourCounts,
              borderColor: '#059669',
              backgroundColor: 'rgba(5, 150, 105, 0.12)',
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            animation: false,
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: textColor }, grid: { display: false } },
              y: { beginAtZero: true, ticks: { color: textColor }, grid: { color: gridColor } }
            }
          }
        });
      }
    }

    // 1.2 Sinflar Kesimi Jadvali
    function renderClassesSummaryTable() {
      const tbody = document.getElementById('classesSummaryTableBody');
      if (!tbody) return;
      const allStudents = Object.values(cachedStudents);
      const rowsHtml = [];

      ORDERED_CLASSES.forEach((cName, idx) => {
        const cStudents = allStudents.filter(s => s.class === cName);
        const total = cStudents.length;
        let ertAbsent = 0;
        let anyHourAbsent = 0;
        let ratioSum = 0;

        cStudents.forEach(st => {
          const rec = cachedAttendance[st.id] || {};
          if (getEffectiveStatus(rec, 'ERT') === 'absent') ertAbsent++;
          if (ALL_ATT_KEYS.some(k => getEffectiveStatus(rec, k) === 'absent')) anyHourAbsent++;
          ratioSum += getStudentDailyRatio(rec);
        });

        const ertPresent = Math.max(0, total - ertAbsent);
        const ertPct = total > 0 ? ((ertPresent / total) * 100).toFixed(1) : "100.0";
        const dailyPct = total > 0 ? ((ratioSum / total) * 100).toFixed(1) : "100.0";
        const badgeCls = Number(dailyPct) >= 95 ? 'badge-present' : (Number(dailyPct) >= 85 ? 'badge-late' : 'badge-absent');

        rowsHtml.push(`
          <tr class="hover:bg-slate-100/60 transition">
            <td class="p-3.5 text-center font-bold text-slate-400">${idx + 1}</td>
            <td class="p-3.5 font-extrabold text-slate-800">${cName} sinf</td>

            <td class="p-3.5 text-center text-emerald-700 font-bold">${ertPresent}</td>
            <td class="p-3.5 text-center text-rose-600 font-bold">${ertAbsent}</td>
            <td class="p-3.5 text-center font-bold">${ertPct}%</td>
            <td class="p-3.5 text-center font-bold ${anyHourAbsent > 0 ? 'text-rose-600' : 'text-slate-400'}">${anyHourAbsent} nafar</td>
            <td class="p-3.5 text-center"><span class="px-2.5 py-1 rounded-lg font-extrabold ${badgeCls}">${dailyPct}%</span></td>
          </tr>
        `);
      });

      tbody.innerHTML = rowsHtml.join('');
    }

    // 1.3 O'quvchilar Ro'yxati (300 qatorni 0.01 soniyada chizish)

      const tbody = document.getElementById('studentsManageTableBody');
      if (!tbody) return;

      const clsFilter = document.getElementById('filterStudentsClass')?.value || 'ALL';
      const stFilter = document.getElementById('filterStudentsStatus')?.value || 'ALL';
      const q = (document.getElementById('searchStudentsInput')?.value || '').toLowerCase();

      let list = sortStudentsCanonical(Object.values(cachedStudents));

      list = list.filter(st => {
        if (clsFilter !== 'ALL' && st.class !== clsFilter) return false;
        if (q && !st.name.toLowerCase().includes(q)) return false;
        if (stFilter !== 'ALL') {
          const rec = cachedAttendance[st.id] || {};
          const hasMatch = ALL_ATT_KEYS.some(k => getEffectiveStatus(rec, k) === stFilter);
          if (!hasMatch) return false;
        }
        return true;
      });

      const cellBadge = (rec, key) => {
        const val = getEffectiveStatus(rec, key);
        if (val === 'absent') return `<span class="px-1.5 py-0.5 rounded badge-absent font-bold text-[10px]">Yo'q</span>`;
        if (val === 'late') return `<span class="px-1.5 py-0.5 rounded badge-late font-bold text-[10px]">Kech</span>`;
        if (val === 'excused') return `<span class="px-1.5 py-0.5 rounded badge-excused font-bold text-[10px]" title="${rec?.ERT_REASON || ''}">Sab</span>`;
        return `<span class="text-emerald-600 font-bold">✓</span>`;
      };

      const rowsHtml = list.map((st, idx) => {
        const rec = cachedAttendance[st.id] || {};
        const pct = (getStudentDailyRatio(rec) * 100).toFixed(0);
        return `
          <tr class="hover:bg-slate-100/60 transition">
            <td class="p-2.5 text-center font-bold text-slate-400">${idx + 1}</td>
            <td class="p-2.5 font-bold text-slate-800">${st.name}</td>
            <td class="p-2.5 text-center font-extrabold text-teal-700">${st.class}</td>
            <td class="p-2.5 text-center">${cellBadge(rec, 'ERT')}</td>
            <td class="p-1.5 text-center">${cellBadge(rec, '1')}</td>
            <td class="p-1.5 text-center">${cellBadge(rec, '2')}</td>
            <td class="p-1.5 text-center">${cellBadge(rec, '3')}</td>
            <td class="p-1.5 text-center">${cellBadge(rec, '4')}</td>
            <td class="p-1.5 text-center">${cellBadge(rec, '5')}</td>
            <td class="p-1.5 text-center">${cellBadge(rec, '6')}</td>
            <td class="p-1.5 text-center">${cellBadge(rec, '7')}</td>
            <td class="p-1.5 text-center">${cellBadge(rec, '8')}</td>
            <td class="p-2.5 text-center font-extrabold">${pct}%</td>
            <td class="p-2.5 text-right space-x-1">
              <button onclick="openStudentFormModal('${st.id}')" class="px-2 py-1 bg-teal-50 text-teal-700 rounded-lg font-bold"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteStudent('${st.id}')" class="px-2 py-1 badge-absent rounded-lg font-bold"><i class="fa-solid fa-trash-can"></i></button>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = rowsHtml.join('');
    }

    function handleStudentsExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
          const updates = {};
          let count = 0;
          rows.forEach((r, idx) => {
            const keys = Object.keys(r);
            const name = String(r['F.I.SH'] || r['O\'quvchi'] || r[keys[0]] || '').trim();
            const cls = String(r['Sinf'] || r['Sinfi'] || r[keys[1]] || '').trim();
            if (!name || !cls || name.toLowerCase() === 'f.i.sh') return;
            const id = 's_' + Date.now() + '_' + idx;
            updates[`students/${id}`] = { id, name, class: cls };
            count++;
          });
          if (count > 0) {
            db.ref().update(updates, () => alert(`✅ ${count} nafar o'quvchi muvaffaqiyatli qo'shildi!`));
          }
          event.target.value = '';
        } catch (err) {
          alert("Excel faylni o'qishda xatolik!");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function getDayIndexFromDateStr(dateStr) {
      const p = dateStr.split('-');

      // O'qituvchining bugungi dars jadvaliga qarab ruxsat etilgan sinf va soatlarni chiqarish
      const dayMap = getTeacherScheduleForDay(currentUser.login, dayIdx);

        allowedPairs.push({ cls: currentUser.class, period: 'ERT', label: `${currentUser.class} • Ertalabki yo'qlama` });
      }

          allowedPairs.push({ cls: c, period: String(h), label: `${c} • ${h}-soat` });

        clsSel.innerHTML = `<option value="">Bugun dars yo'q</option>`;

      const periodsForCls = allowedPairs.filter(p => p.cls === selectedCls);

    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const phi1 = (lat1 * Math.PI) / 180;
      const phi2 = (lat2 * Math.PI) / 180;
      const dPhi = ((lat2 - lat1) * Math.PI) / 180;
      const dLambda = ((lon2 - lon1) * Math.PI) / 180;
      const a = Math.sin(dPhi / 2) * Math.sin(dPhi / 2) +
                Math.cos(phi1) * Math.cos(phi2) * Math.sin(dLambda / 2) * Math.sin(dLambda / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function evaluateAreaStateFromCoords(lat, lng, accuracy = 0) {
      if (!cachedSchoolLocation || !cachedSchoolLocation.lat) return 'inside';
      const dist = calculateDistanceMeters(lat, lng, cachedSchoolLocation.lat, cachedSchoolLocation.lng);
      const allowedRadius = (Number(cachedSchoolLocation.radius) || 250) + Math.min(Number(accuracy) || 0, 100);
      return dist <= allowedRadius ? 'inside' : 'outside';
    }

    function isTeacherAllowedToTakeAttendanceByGeo() {
      if (!currentUser || currentUser.role === 'admin' || currentUser.role === 'creator') {
        return { allowed: true };

      if (!cachedSchoolLocation || !cachedSchoolLocation.lat) {
        return { allowed: true };
      }
      if (cachedSchoolLocation.ip && currentDeviceIp && cachedSchoolLocation.ip === currentDeviceIp) {
        latestTeacherAreaState = 'inside';
        return { allowed: true };
      }
      if (latestTeacherAreaState === 'inside') {
        return { allowed: true };
      }
      if (latestTeacherAreaState === 'denied') {
        return {
          allowed: false,
          title: "GPS joylashuvga ruxsat berilmagan!",
          desc: "Davomat olish uchun telefoningizda joylashuv (Geolocation) ruxsatini yoqing."
        };
      }
      return {
        allowed: false,
        title: "Siz maktab hududidan tashqaridasiz!",
        desc: "Dars davomatini belgilash faqat maktab hududi ichida (yoki maktab Wi-Fi tarmog'ida) amalga oshiriladi."

    }

    // O'qituvchining 1-darsi, kelgan/ketgan vaqti, kechikishi va dars vaqtida tashqarida yurgan daqiqalarini hisoblash
    function analyzeTeacherDailyMetrics(teacherLogin, dayIdx) {
      const dayMap = getTeacherScheduleForDay(teacherLogin, dayIdx);
      const scheduledHours = Object.keys(dayMap).filter(h => Boolean(dayMap[h])).map(Number).sort((a, b) => a - b);
      const firstH = scheduledHours.length > 0 ? String(scheduledHours[0]) : null;
      const firstLessonSlot = firstH ? (cachedBellTimes[firstH] || DEFAULT_BELL_TIMES[firstH]) : null;

      const checkInRec = cachedCheckInOut[teacherLogin] || {};
      const minLogs = ((cachedAttendance['_MINUTE_LOGS'] || {})[teacherLogin]) || {};
      const insideTimes = Object.keys(minLogs).filter(t => minLogs[t] === 'inside').sort();

      const arrivalTime = checkInRec.checkInTime || (insideTimes.length > 0 ? insideTimes[0] : '—');
      const departureTime = checkInRec.checkOutTime || (insideTimes.length > 0 ? insideTimes[insideTimes.length - 1] : '—');

      let latenessHtml = `<span class="text-slate-300">—</span>`;
      let lateMins = 0;

      if (firstLessonSlot && firstLessonSlot.start) {
        if (arrivalTime !== '—') {
          const planMins = timeStrToMinutes(firstLessonSlot.start);
          const arrMins = timeStrToMinutes(arrivalTime);
          if (arrMins > planMins) {
            lateMins = arrMins - planMins;
            latenessHtml = `<span class="px-2 py-0.5 rounded-md badge-absent font-bold">${lateMins} daq kech</span>`;
          } else {
            latenessHtml = `<span class="px-2 py-0.5 rounded-md badge-present font-bold">Vaqtida</span>`;
          }
        } else {
          latenessHtml = `<span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-400 font-bold">Kelmagan</span>`;
        }
      }

      // Faqat o'qituvchining o'z dars soatlari ichida ("okno" soatlarni hisobga olmasdan) tashqarida bo'lgan daqiqalarini sanash
      let outsideMinsDuringLessons = 0;
      scheduledHours.forEach(hNum => {
        const slot = cachedBellTimes[String(hNum)] || DEFAULT_BELL_TIMES[String(hNum)];
        if (!slot || !slot.start || !slot.end) return;
        const sM = timeStrToMinutes(slot.start);
        const eM = timeStrToMinutes(slot.end);
        Object.keys(minLogs).forEach(tKey => {
          if (minLogs[tKey] === 'outside') {
            const m = timeStrToMinutes(tKey);
            if (m >= sM && m <= eM) outsideMinsDuringLessons++;
          }
        });
      });

      const outsideDuringLessonHtml = outsideMinsDuringLessons > 0
        ? `<span class="px-2 py-0.5 rounded-md badge-absent font-bold">${outsideMinsDuringLessons} daq tashqarida</span>`
        : `<span class="px-2 py-0.5 rounded-md badge-present font-bold">0 daq</span>`;

      return {
        firstLessonLabel: firstLessonSlot ? `${firstH}-soat (${firstLessonSlot.start})` : "Dars yo'q",
        arrivalTime,
        departureTime,
        lateMins,
        outsideMinsDuringLessons,
        latenessHtml,
        outsideDuringLessonHtml
      };
    }

    function getAreaStatusBadgeHtml(state, subClass = '') {
      if (state === 'inside') return `<span class="px-2 py-0.5 rounded-md badge-present font-bold">Hududda ${subClass ? '(' + subClass + ')' : ''}</span>`;
      if (state === 'outside') return `<span class="px-2 py-0.5 rounded-md badge-absent font-bold">Tashqarida</span>`;
      if (state === 'denied') return `<span class="px-2 py-0.5 rounded-md badge-late font-bold">GPS o'chiq</span>`;
      if (state === 'no_lessons') return `<span class="text-slate-300 text-[11px]">Bugun dars yo'q</span>`;
      if (state === 'finished') return `<span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 font-bold">Darsi tugagan</span>`;
      if (state === 'stale') return `<span class="px-2 py-0.5 rounded-md badge-late font-bold">Aloqa uzilgan</span>`;

    // ==================== 13. ISHCHI-XODIMLAR SMENA VA KELISH-KETISH MANTIQI ====================
    function getWorkerShiftTimes(wObj) {
      const title = wObj?.jobTitle || "Maktab xodimi";
      const preset = WORKER_ROLE_PRESETS[title] || WORKER_ROLE_PRESETS["Maktab xodimi"];
      return {
        start: wObj?.workStart || preset.start || "08:00",
        end: wObj?.workEnd || preset.end || "17:00"
      };
    }

    function calcShiftDurationMinutes(startStr, endStr) {
      const s = timeStrToMinutes(startStr);
      const e = timeStrToMinutes(endStr);
      if (e > s) return e - s;
      if (e < s) return (24 * 60 - s) + e;
      return 8 * 60;
    }

    function evaluateWorkerDayPerformance(wObj, rec, isToday = false) {
      const shift = getWorkerShiftTimes(wObj);
      const plannedMins = Math.max(1, calcShiftDurationMinutes(shift.start, shift.end));
      const plannedHoursStr = (plannedMins / 60).toFixed(1);
      const startMins = timeStrToMinutes(shift.start);
      const endMins = timeStrToMinutes(shift.end);
      const isNight = endMins < startMins;

      if (!rec || !rec.checkInTime) {
        return {
          shiftLabel: `${shift.start} – ${shift.end}`,
          plannedMins, plannedHoursStr,
          workedMins: 0, workedHoursStr: "0.0",
          lateMins: 0, earlyLeaveMins: 0, pct: 0,
          lateHtml: `<span class="text-slate-400 text-[11px]">Kelmagan</span>`,
          earlyHtml: `<span class="text-slate-300">—</span>`,
          statusBadgeHtml: `<span class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-slate-100 text-slate-400">Kelmagan (0%)</span>`
        };
      }

      const inMins = timeStrToMinutes(rec.checkInTime);
      let lateMins = 0;
      if (!isNight) {
        if (inMins > startMins) lateMins = inMins - startMins;
      } else {
        if (inMins > startMins && inMins < 24 * 60) lateMins = inMins - startMins;
      }

      let lateHtml = `<span class="px-2 py-0.5 rounded-md badge-present font-bold">Vaqtida</span>`;
      if (lateMins > 0) {
        lateHtml = `<span class="px-2 py-0.5 rounded-md badge-absent font-bold">${lateMins} daq kech</span>`;
      }

      let earlyLeaveMins = 0;
      let earlyHtml = `<span class="text-slate-400 text-[11px]">Ishda...</span>`;
      let workedMins = 0;

      if (rec.checkOutTime) {
        const outMins = timeStrToMinutes(rec.checkOutTime);
        if (!isNight) {
          if (outMins < endMins) earlyLeaveMins = endMins - outMins;
          const effStart = Math.max(startMins, inMins);
          const effEnd = Math.min(endMins, outMins);
          workedMins = Math.max(0, effEnd - effStart);
        } else {
          workedMins = calcShiftDurationMinutes(rec.checkInTime, rec.checkOutTime);
          if (workedMins > plannedMins) workedMins = plannedMins;
          if (workedMins < plannedMins) earlyLeaveMins = Math.max(0, plannedMins - workedMins - lateMins);
        }

        if (earlyLeaveMins > 5) {
          earlyHtml = `<span class="px-2 py-0.5 rounded-md badge-late font-bold">${earlyLeaveMins} daq erta</span>`;
        } else {
          earlyHtml = `<span class="px-2 py-0.5 rounded-md badge-present font-bold">To'liq</span>`;
        }
      } else if (isToday) {
        const nowMins = new Date().getHours() * 60 + new Date().getMinutes();
        if (!isNight && nowMins > inMins) {
          const effStart = Math.max(startMins, inMins);
          const effNow = Math.min(endMins, nowMins);
          workedMins = Math.max(0, effNow - effStart);
        } else {
          workedMins = Math.min(plannedMins, Math.max(0, plannedMins - lateMins));
        }
      }

      const pct = Math.min(100, Math.max(0, (workedMins / plannedMins) * 100));
      let statusBadgeHtml = '';

      if (rec.status === 'suspicious') {
        statusBadgeHtml = `<span class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold badge-absent"><i class="fa-solid fa-triangle-exclamation mr-1"></i>GUMONLI</span>`;
      } else if (!rec.checkOutTime) {
        statusBadgeHtml = `<span class="px-2.5 py-1 rounded-lg text-[10px] font-bold badge-present"><i class="fa-solid fa-spinner fa-spin mr-1"></i>Ishda</span>`;
      } else if (pct >= 95) {
        statusBadgeHtml = `<span class="px-2.5 py-1 rounded-lg text-[10px] font-bold badge-present"><i class="fa-solid fa-circle-check mr-1"></i>Tasdiqlangan</span>`;
      } else {
        statusBadgeHtml = `<span class="px-2.5 py-1 rounded-lg text-[10px] font-bold badge-late">${pct.toFixed(0)}%</span>`;
      }

      return {
        shiftLabel: `${shift.start} – ${shift.end}`,
        plannedMins, plannedHoursStr,
        workedMins, workedHoursStr: (workedMins / 60).toFixed(1),
        lateMins, earlyLeaveMins,
        pct: Number(pct.toFixed(1)),
        lateHtml, earlyHtml, statusBadgeHtml
      };
    }

    function renderWorkersMonthlySummaryTable() {
      const tbody = document.getElementById('workersMonthlySummaryTableBody');
      if (!tbody) return;
      tbody.innerHTML = `<tr class="text-center"><td colspan="11" class="p-4 text-slate-400 font-bold">Hisoblanmoqda...</td></tr>`;

      const parts = currentDayStr.split('-');
      const endDate = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      const weeksDates = [[], [], [], []];

      for (let i = 27; i >= 0; i--) {
        const d = new Date(endDate);
        d.setDate(endDate.getDate() - i);
        const wIdx = Math.floor((27 - i) / 7);
        if (d.getDay() !== 0) weeksDates[wIdx].push(formatDateLocal(d));
      }

      const startDateStr = weeksDates[0][0] || currentDayStr;

      db.ref('attendance').orderByKey().startAt(startDateStr).endAt(currentDayStr).once('value', snap => {
        const allAtt = snap.val() || {};
        const workers = Object.values(cachedWorkers);

        const rowsHtml = workers.map((w, idx) => {
          const shift = getWorkerShiftTimes(w);
          const dailyPlanHours = calcShiftDurationMinutes(shift.start, shift.end) / 60;
          const wWorked = [0, 0, 0, 0];
          const wPlanned = [0, 0, 0, 0];

          weeksDates.forEach((wDays, wIdx) => {
            wDays.forEach(dStr => {
              wPlanned[wIdx] += dailyPlanHours;
              const rec = ((allAtt[dStr] || {})['_CHECKINOUT'] || {})[w.login];
              if (rec && rec.checkInTime) {
                const perf = evaluateWorkerDayPerformance(w, rec, dStr === todayDayStr);
                wWorked[wIdx] += (perf.workedMins / 60);
              }
            });
          });

          const totalPlan = wPlanned.reduce((a, b) => a + b, 0);
          const totalDone = wWorked.reduce((a, b) => a + b, 0);
          const pct = totalPlan > 0 ? ((totalDone / totalPlan) * 100).toFixed(1) : "0.0";
          const pctBadge = Number(pct) >= 90 ? 'badge-present' : (Number(pct) > 0 ? 'badge-late' : 'bg-slate-100 text-slate-400');

          return `
            <tr class="hover:bg-slate-100/60 transition">
              <td class="p-3 font-bold text-slate-400 text-center">${idx + 1}</td>
              <td class="p-3 font-bold text-slate-800">${w.name}</td>
              <td class="p-3 font-semibold text-indigo-700">${w.jobTitle || 'Maktab xodimi'}</td>
              <td class="p-3 text-center font-mono text-[11px] font-bold">${shift.start} – ${shift.end} (${dailyPlanHours.toFixed(1)}s)</td>
              <td class="p-3 text-center font-mono">${wWorked[0].toFixed(1)} / ${wPlanned[0].toFixed(0)}s</td>
              <td class="p-3 text-center font-mono">${wWorked[1].toFixed(1)} / ${wPlanned[1].toFixed(0)}s</td>
              <td class="p-3 text-center font-mono">${wWorked[2].toFixed(1)} / ${wPlanned[2].toFixed(0)}s</td>
              <td class="p-3 text-center font-mono">${wWorked[3].toFixed(1)} / ${wPlanned[3].toFixed(0)}s</td>
              <td class="p-3 text-center font-bold">${totalPlan.toFixed(0)} soat</td>
              <td class="p-3 text-center"><span class="px-2 py-0.5 rounded-md badge-present font-bold">${totalDone.toFixed(1)} soat</span></td>
              <td class="p-3 text-center"><span class="px-2 py-0.5 rounded-md font-extrabold ${pctBadge}">${pct}%</span></td>
            </tr>
          `;
        });

        tbody.innerHTML = rowsHtml.join('');
      });
    }

    function generateAutoLoginFromName(fullName, existingLoginsSet) {
      const clean = String(fullName).toLowerCase()
        .replace(/o‘|o'|ў/g, 'o').replace(/g‘|g'|ғ/g, 'g')
        .replace(/sh|ш/g, 'sh').replace(/ch|ч/g, 'ch')
        .replace(/[^a-z0-9\s]/g, '').trim();
      const parts = clean.split(/\s+/);
      let base = parts[0] || ('xodim_' + Math.floor(Math.random() * 900 + 100));
      if (parts[1]) base += '_' + parts[1].charAt(0);

      let candidate = base;
      let counter = 1;
      while (existingLoginsSet.has(candidate)) {
        candidate = `${base}${counter}`;
        counter++;
      }
      existingLoginsSet.add(candidate);
      return candidate;
    }

    // ==================== 15. "🟢 KELDIM / 🔴 KETDIM" VA GUMONLI HOLAT ALGORITMI ====================
    function getUserEffectiveLogin() {
      if (!currentUser) return null;
      return currentUser.login || currentUser.id || 'creator';
    }

    function getTeacherLessonCompletionStats(teacherLogin, dayIdx) {
      const dayMap = getTeacherScheduleForDay(teacherLogin, dayIdx);
      const scheduledHours = Object.keys(dayMap).filter(h => Boolean(dayMap[h]));
      const totalScheduled = scheduledHours.length;
      if (totalScheduled === 0) {
        return { totalScheduled: 0, confirmedCount: 0, allConfirmed: false };
      }

      const subMap = cachedAttendance['_SUBMITTED'] || {};
      const locMap = (cachedAttendance['_LOCATIONS'] || {})[teacherLogin] || {};
      let confirmedCount = 0;

      scheduledHours.forEach(h => {
        const cls = dayMap[h];
        const classesArr = String(cls).split(',').map(s => s.trim()).filter(Boolean);
        const isDone = Boolean(locMap[h]) || classesArr.some(c => subMap[c] && subMap[c][h]);
        if (isDone) confirmedCount++;
      });

      return {
        totalScheduled,
        confirmedCount,
        allConfirmed: confirmedCount >= totalScheduled
      };
    }

    function handleUserCheckIn() {
      if (!currentUser) return;
      const loginKey = getUserEffectiveLogin();
      const nowTime = getCurrentTimeHHMM();

      startSilentAudioKeepAlive();
      requestScreenWakeLock();
      requestLessonNotificationPermission(false);

      const finalizeCheckIn = (areaState) => {
        if (areaState === 'outside' && currentUser.role !== 'creator') {
          return alert("⚠️ Diqqat! Siz maktab hududidan tashqaridasiz.\n'Keldim' tugmasini faqat maktab hududiga kirgach bosishingiz mumkin!");
        }
        if (areaState === 'denied' && currentUser.role !== 'creator') {
          return alert("📍 Iltimos, telefoningizda GPS joylashuvga ruxsat bering! Maktab hududida ekanligingizni tasdiqlash kerak.");
        }

        const existing = cachedCheckInOut[loginKey] || {};
        const checkInTime = existing.checkInTime || nowTime;

        const payload = {
          ...existing,
          checkInTime,
          checkInArea: 'inside',
          checkInTs: existing.checkInTs || Date.now(),
          status: existing.checkOutTime ? existing.status : 'working'
        };

        db.ref(`attendance/${todayDayStr}/_CHECKINOUT/${loginKey}`).set(payload);
        db.ref(`attendance/${todayDayStr}/_MINUTE_LOGS/${loginKey}/${checkInTime}`).set('inside');
        db.ref(`attendance/${todayDayStr}/_LIVE_LOC/${loginKey}`).set({
          state: 'inside',
          time: checkInTime,
          ts: Date.now()
        });
        alert(`✅ Maktabga kelgan vaqtingiz (${checkInTime}) muvaffaqiyatli qayd etildi!`);
      };

      if (!cachedSchoolLocation || !cachedSchoolLocation.lat || currentUser.role === 'creator') {
        latestTeacherAreaState = 'inside';
        finalizeCheckIn('inside');
        return;
      }

      if (cachedSchoolLocation.ip && currentDeviceIp && cachedSchoolLocation.ip === currentDeviceIp) {
        latestTeacherAreaState = 'inside';
        finalizeCheckIn('inside');
        return;
      }

      if (!navigator.geolocation) {
        finalizeCheckIn('denied');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          latestTeacherAreaState = evaluateAreaStateFromCoords(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
          updateTeacherGeoWarningUI();
          finalizeCheckIn(latestTeacherAreaState);
        },
        () => {
          if (latestTeacherAreaState === 'inside') finalizeCheckIn('inside');
          else finalizeCheckIn('denied');
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 15000 }
      );
    }

    function handleUserCheckOut() {
      if (!currentUser) return;
      const loginKey = getUserEffectiveLogin();
      const existing = cachedCheckInOut[loginKey] || {};

      if (!existing.checkInTime) {
        return alert("⚠️ Siz bugun hali 'Keldim' tugmasini bosmagansiz! Avval 'Keldim' tugmasini bosing.");
      }

      const nowTime = getCurrentTimeHHMM();
      const dayIdx = getDayIndexFromDateStr(todayDayStr);
      const isTeacherUser = Boolean(cachedTeachers[currentUser.id]) && currentUser.role !== 'worker' && currentUser.role !== 'admin';
      const lessonStats = isTeacherUser
        ? getTeacherLessonCompletionStats(loginKey, dayIdx)
        : { totalScheduled: 0, confirmedCount: 0, allConfirmed: false };

      const finalizeCheckOut = (areaState) => {
        let finalStatus = 'confirmed';

        if (areaState === 'inside') {
          if (isTeacherUser && lessonStats.totalScheduled > 0 && !lessonStats.allConfirmed) {
            finalStatus = 'inside_incomplete';
          } else {
            finalStatus = 'confirmed';
          }
        } else {
          // Maktab hududidan tashqarida "Ketdim" bosildi:
          // Agar o'qituvchi barcha darslarini tasdiqlagan bo'lsa -> Qabul qilinadi, aks holda -> GUMONLI
          if (isTeacherUser && lessonStats.totalScheduled > 0 && lessonStats.allConfirmed) {
            finalStatus = 'accepted_full_lessons';
          } else {
            finalStatus = 'suspicious';
          }
        }

        const payload = {
          ...existing,
          checkOutTime: nowTime,
          checkOutArea: areaState,
          checkOutTs: Date.now(),
          lessonsSummary: `${lessonStats.confirmedCount}/${lessonStats.totalScheduled}`,
          status: finalStatus
        };

    function startSilentAudioKeepAlive() {
      try {
        if (silentAudioCtx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        silentAudioCtx = new AudioCtx();
        silentOscillator = silentAudioCtx.createOscillator();
        const gain = silentAudioCtx.createGain();
        gain.gain.value = 0.00001;
        silentOscillator.connect(gain);
        gain.connect(silentAudioCtx.destination);
        silentOscillator.start();
      } catch (e) {}
    }

    }

    function stopAllBackgroundPersistence() {
      if (geoWatchId !== null && navigator.geolocation) {
        navigator.geolocation.clearWatch(geoWatchId);
        geoWatchId = null;
      }
      if (silentOscillator) {
        try { silentOscillator.stop(); } catch (e) {}
        silentOscillator = null;
      }
      if (silentAudioCtx) {
        try { silentAudioCtx.close(); } catch (e) {}
        silentAudioCtx = null;
      }
      if (wakeLockSentinel) {
        try { wakeLockSentinel.release(); } catch (e) {}
        wakeLockSentinel = null;
      }
    }

    function startSilentLocationTracking() {
      if (!currentUser || currentUser.role === 'creator' || !navigator.geolocation) return;
      if (geoWatchId !== null) navigator.geolocation.clearWatch(geoWatchId);

      geoWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          const newState = evaluateAreaStateFromCoords(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
          const stateChanged = (newState !== latestTeacherAreaState);
          latestTeacherAreaState = newState;
          updateTeacherGeoWarningUI();

          // QOTMASLIK UCHUN: Firebase'ga har soniyada emas, faqat holat o'zgarganda yoki 60 soniyada 1 marta yozamiz
          const nowTs = Date.now();
          if (stateChanged || (nowTs - lastFirebaseGeoWriteTs >= 60000)) {
            lastFirebaseGeoWriteTs = nowTs;
            const hhmm = getCurrentTimeHHMM();
            const hNum = new Date().getHours();
            if (hNum >= 7 && hNum <= 19 && currentUser.login) {
              if (navigator.onLine) {
                db.ref(`attendance/${todayDayStr}/_LIVE_LOC/${currentUser.login}`).set({
                  state: newState,
                  time: hhmm,
                  ts: nowTs
                });
                db.ref(`attendance/${todayDayStr}/_MINUTE_LOGS/${currentUser.login}/${hhmm}`).set(newState);
              } else {
                const bufKey = `school_loc_buffer_${todayDayStr}_${currentUser.login}`;
                const buf = JSON.parse(localStorage.getItem(bufKey) || '{}');
                buf[hhmm] = newState;
                localStorage.setItem(bufKey, JSON.stringify(buf));
              }
            }
          }
        },
        () => {
          latestTeacherAreaState = 'denied';
          updateTeacherGeoWarningUI();
        },
        { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 }
      );
    }

    function playNotificationBellSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        [587.33, 880].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.22);
          gain.gain.setValueAtTime(0.25, now + i * 0.22);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.22 + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.22);
          osc.stop(now + i * 0.22 + 0.45);
        });
      } catch (e) {}
    }

      if (!currentUser || !currentUser.login || currentUser.role === 'creator') return;

      if (currentUser.role === 'worker' || currentUser.role === 'admin') {

            localStorage.setItem(k5, '1');

      const dayIdx = getDayIndexFromDateStr(todayDayStr);
      const dayMap = getTeacherScheduleForDay(currentUser.login, dayIdx);

      for (let h = 1; h <= 8; h++) {
        const hKey = String(h);
        const cls = dayMap[hKey];
        if (!cls) continue;

        const slot = cachedBellTimes[hKey] || DEFAULT_BELL_TIMES[hKey];
        if (!slot || !slot.start) continue;

        const startMins = timeStrToMinutes(slot.start);
        const diff = startMins - curMins;

        if (diff <= 10 && diff >= 8) {
          const key10 = `notif10_${todayDayStr}_${currentUser.login}_${hKey}`;
          if (!localStorage.getItem(key10)) {
            localStorage.setItem(key10, '1');

              `Soat ${slot.start} da ${cls} sinfida ${hKey}-soat darsingiz boshlanadi. Tayyorgarlik ko'ring!`
            );
          }
        }

        if (diff <= 5 && diff >= 3) {
          const key5 = `notif5_${todayDayStr}_${currentUser.login}_${hKey}`;
          if (!localStorage.getItem(key5)) {
            localStorage.setItem(key5, '1');

              `Soat ${slot.start} da ${cls} sinfida darsingiz boshlanadi. Davomatni tasdiqlashni unutmang!`

          }
        }
      }
    }

    // ==================== 18. QURILMALAR XAVFSIZLIGI (1/2/3 TELEFON) VA TIZIMNI 0 DAN TOZALASH ====================
    function getOrCreateDeviceFingerprint() {
      let fp = localStorage.getItem('school_device_fp_id');
      if (fp) return fp;

      const nav = window.navigator;
      const scr = window.screen;
      const rawSig = [
        nav.platform || '', nav.language || '',
        scr.width + 'x' + scr.height, scr.colorDepth || '',
        window.devicePixelRatio || 1, nav.hardwareConcurrency || ''
      ].join('|');

      let hash = 0;
      for (let i = 0; i < rawSig.length; i++) {
        hash = ((hash << 5) - hash) + rawSig.charCodeAt(i);
        hash |= 0;
      }
      const randSuffix = Math.random().toString(36).substring(2, 6).toUpperCase();
      fp = 'DEV-' + Math.abs(hash).toString(16).toUpperCase().substring(0, 4) + '-' + randSuffix;
      localStorage.setItem('school_device_fp_id', fp);
      return fp;
    }

    async function detectDetailedDeviceName() {
      const ua = navigator.userAgent || '';
      const scrW = Math.min(window.screen.width, window.screen.height);
      const scrH = Math.max(window.screen.width, window.screen.height);
      const dpr = window.devicePixelRatio || 1;

      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        try {
          const vals = await navigator.userAgentData.getHighEntropyValues(['model', 'platform', 'platformVersion']);
          if (vals.model) {
            const plat = vals.platform || 'Android';
            const ver = vals.platformVersion ? vals.platformVersion.split('.')[0] : '';
            return `📱 ${vals.model} (${plat}${ver ? ' ' + ver : ''})`;
          }
        } catch (e) {}
      }

      if (/android/i.test(ua)) {
        const verMatch = ua.match(/Android\s+([\d.]+)/i);
        const verStr = verMatch ? `Android ${verMatch[1]}` : 'Android';
        const modelMatch = ua.match(/;\s*([^;)]+?)\s+Build\//i) || ua.match(/Android[^;]+;\s*([^;)]+)/i);
        if (modelMatch && modelMatch[1]) {
          const cleanModel = modelMatch[1].replace(/wv$/i, '').trim();
          if (cleanModel && cleanModel !== 'K') return `📱 ${cleanModel} (${verStr})`;
        }
        return `📱 Android Smartfon (${verStr} • ${scrW}×${scrH})`;
      }

      if (/iPhone|iPad|iPod/i.test(ua)) {
        const iosMatch = ua.match(/OS\s+([\d_]+)/i);
        const iosVer = iosMatch ? `iOS ${iosMatch[1].replace(/_/g, '.')}` : 'iOS';
        return `🍎 iPhone (${iosVer} • ${scrW}×${scrH} @${dpr}x)`;
      }

      if (/Windows NT 10\.0/i.test(ua)) return `💻 Windows 10/11 Kompyuter (${scrW}×${scrH})`;
      if (/Windows/i.test(ua)) return `💻 Windows Kompyuter`;
      if (/Macintosh|Mac OS X/i.test(ua)) return `💻 MacBook / macOS`;
      return `📱 Qurilma (${scrW}×${scrH})`;
    }

    function handleScheduleUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
          const newMap = {};

          rows.forEach(r => {
            const keys = Object.keys(r);
            const login = String(r['Login'] || r[keys[1]] || '').trim();
            const dayIdx = parseInt(r['Kun (1=Dush..6=Shan)'] || r['Kun'] || r[keys[2]], 10);
            if (!login || isNaN(dayIdx) || dayIdx < 1 || dayIdx > 6) return;
            if (!newMap[login]) newMap[login] = {};
            if (!newMap[login][dayIdx]) newMap[login][dayIdx] = {};
            for (let h = 1; h <= 8; h++) {
              const val = String(r[`${h}-soat`] || r[keys[2 + h]] || '').trim();
              if (val) newMap[login][dayIdx][String(h)] = val;
            }
          });

          db.ref('schedules').set({ fileName: file.name, teacherMap: newMap }, () => {
            alert("✅ Dars jadvali muvaffaqiyatli yuklandi!");
            event.target.value = '';
          });
        } catch (err) {
          alert("Jadval faylini o'qishda xatolik!");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function handleWorkersExcelImport(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });

          const existingLogins = new Set(getAllStaffCombined().map(u => (u.login || '').toLowerCase()));
          const updates = {};
          let addedCount = 0;

          rows.forEach((row, idx) => {
            const keys = Object.keys(row);
            const name = String(row['F.I.SH'] || row['Ism'] || row[keys[0]] || '').trim();
            if (!name || name.toLowerCase() === 'f.i.sh') return;

            const jobTitle = String(row['Lavozimi'] || row[keys[1]] || 'Maktab xodimi').trim();
            const preset = WORKER_ROLE_PRESETS[jobTitle] || WORKER_ROLE_PRESETS["Maktab xodimi"];
            const workStart = String(row['Kelish vaqti'] || preset.start).trim();
            const workEnd = String(row['Ketish vaqti'] || preset.end).trim();

            let login = String(row['Login'] || '').trim();
            let pass = String(row['Parol'] || '123456').trim();

            if (!login || existingLogins.has(login.toLowerCase())) {
              login = generateAutoLoginFromName(name, existingLogins);
            } else {
              existingLogins.add(login.toLowerCase());
            }

            const id = 'w_' + Date.now() + '_' + idx;
            updates[`workers/${id}`] = {
              id, name,
              role: jobTitle === 'Administrator xodim' ? 'admin' : 'worker',
              jobTitle,
              workStart: workStart.includes(':') ? workStart : preset.start,
              workEnd: workEnd.includes(':') ? workEnd : preset.end,
              login,
              pass: pass || '123456'
            };
            addedCount++;
          });

          if (addedCount > 0) {
            db.ref().update(updates, () => alert(`✅ ${addedCount} nafar ishchi-xodim muvaffaqiyatli qo'shildi!`));
          }
          event.target.value = '';
        } catch (err) {
          alert("Excel faylni o'qishda xatolik!");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function exportWorkersMonthlyExcel() {
      const parts = currentDayStr.split('-');
      const endDate = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      const dateKeys = [];
      for (let i = 27; i >= 0; i--) {
        const d = new Date(endDate);
        d.setDate(endDate.getDate() - i);
        if (d.getDay() !== 0) dateKeys.push(formatDateLocal(d));
      }

      const startDateStr = dateKeys[0] || currentDayStr;
      db.ref('attendance').orderByKey().startAt(startDateStr).endAt(currentDayStr).once('value', snap => {
        const allAtt = snap.val() || {};
        const workers = Object.values(cachedWorkers);

        const summaryRows = [
          [`Maktab Ishchi-Xodimlarining Oylik Smena Hisoboti (${startDateStr} — ${currentDayStr})`],
          [],
          ["#", "F.I.SH", "Lavozimi", "Smena Vaqti", "Login", "Parol", "Kelgan Kunlari", "Kechikkan Daqiqalari", "Oylik Reja (Soat)", "Amalda Ishladi (Soat)", "Bajarilish %"]
        ];

        const dailyRows = [
          [`Kunlik Kelish va Ketish Vaqtlari (${startDateStr} — ${currentDayStr})`],
          [],
          ["#", "F.I.SH", "Lavozimi", "Smena", ...dateKeys]
        ];

        workers.forEach((w, idx) => {
          const shift = getWorkerShiftTimes(w);
          const dailyPlanHours = calcShiftDurationMinutes(shift.start, shift.end) / 60;
          let daysPresent = 0;
          let totalLateMins = 0;
          let totalPlanHours = 0;
          let totalWorkedHours = 0;
          const perDayCells = [];

          dateKeys.forEach(dKey => {
            totalPlanHours += dailyPlanHours;
            const rec = ((allAtt[dKey] || {})['_CHECKINOUT'] || {})[w.login];
            if (rec && rec.checkInTime) {
              daysPresent++;
              const perf = evaluateWorkerDayPerformance(w, rec, dKey === todayDayStr);
              totalLateMins += perf.lateMins;
              totalWorkedHours += (perf.workedMins / 60);
              perDayCells.push(`${rec.checkInTime}-${rec.checkOutTime || '...'} (${perf.pct}%)`);
            } else {
              perDayCells.push("0%");
            }
          });

          const overallPct = totalPlanHours > 0 ? ((totalWorkedHours / totalPlanHours) * 100).toFixed(1) + "%" : "0.0%";
          summaryRows.push([
            idx + 1, w.name, w.jobTitle || "Maktab xodimi", `${shift.start} - ${shift.end}`,
            w.login, w.pass, `${daysPresent} kun`, `${totalLateMins} daq`,
            `${totalPlanHours.toFixed(0)} soat`, `${totalWorkedHours.toFixed(1)} soat`, overallPct
          ]);
          dailyRows.push([idx + 1, w.name, w.jobTitle || "Maktab xodimi", `${shift.start}-${shift.end}`, ...perDayCells]);
        });

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), "Oylik_Smena_Hisobot");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dailyRows), "Kunlik_Keldim_Ketdim");
        XLSX.writeFile(wb, `Ishchilar_Oylik_Hisobot_${currentDayStr}.xlsx`);
      });
    }

    function exportPeriodExcel(daysCount, periodLabel) {
      const parts = currentDayStr.split('-');

      const dateKeys = [];
      for (let i = daysCount - 1; i >= 0; i--) {
        const d = new Date(endDate);

        if (d.getDay() !== 0) dateKeys.push(formatDateLocal(d));

          [],
          ["#", "O'quvchi F.I.SH", "Sinf", ...dateKeys, "O'rtacha %"]

          const dayCells = dateKeys.map(dKey => {

            const r = getStudentDailyRatio(rec);

            return (r * 100).toFixed(0) + "%";

        XLSX.writeFile(wb, `Oquvchilar_${periodLabel}_${currentDayStr}.xlsx`);

    window.addEventListener('DOMContentLoaded', () => {
      initDatabaseDefaults();

      const savedUser = localStorage.getItem('school_active_user');
      if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          showApp();
        } catch (e) {}
      }

      setInterval(() => {
        checkUpcomingLessonNotifications();
        checkTeacherWorkWindowAndAutoClose();
      }, 20000);
    });
  </script>
